<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rúben Arroz | ESAN</title>
<style>
  :root {
    --bg: #0e0f12;
    --border: #24262b;
    --text: #f2f2f0;
    --text-dim: #8f9198;
    --hover: #ffffff;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    padding: 0 24px;
  }

  header {
    padding-top: 72px;
    padding-bottom: 56px;
  }

  .logos {
    display: flex;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 28px;
    margin-bottom: 56px;
  }

  .logos img {
    width: auto;
    display: block;
  }

  .logos img:first-child {
    height: 72px;
  }

  .logos img:last-child {
    height: 72px;
  }

  .intro h1 {
    font-size: clamp(1.9rem, 5vw, 2.4rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 10px;
  }

  .intro .tagline {
    color: var(--text-dim);
    font-size: 1rem;
    letter-spacing: 0.01em;
    margin-bottom: 24px;
  }

  .intro p {
    color: var(--text-dim);
    font-size: 0.98rem;
    line-height: 1.75;
    max-width: 500px;
  }

  .intro p a {
    color: var(--text);
    text-decoration: none;
    border-bottom: 1px solid var(--text-dim);
  }

  .intro p a:hover {
    border-color: var(--text);
  }

  nav {
    padding-bottom: 80px;
  }

  .link-row {
    display: flex;
    flex-direction: column;
    border-top: 1px solid var(--border);
  }

  .link-row a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 26px 2px;
    text-decoration: none;
    color: var(--text);
    border-bottom: 1px solid var(--border);
    transition: color 0.15s ease;
  }

  .link-row a:hover .name {
    color: var(--hover);
    text-decoration: underline;
    text-underline-offset: 4px;
  }

  .link-row .name {
    font-size: 1.1rem;
    font-weight: 500;
  }

  .link-row .desc {
    color: var(--text-dim);
    font-size: 0.85rem;
    text-align: right;
  }

  footer {
    margin-top: auto;
    padding: 28px 0 36px;
    border-top: 1px solid var(--border);
    text-align: center;
  }

  footer p {
    color: var(--text-dim);
    font-size: 0.78rem;
  }

  @media (max-width: 520px) {
    header {
      padding-top: 48px;
      padding-bottom: 40px;
    }

    .logos {
      gap: 20px;
      margin-bottom: 36px;
    }

    .logos img:first-child {
      height: 52px;
    }

    .logos img:last-child {
      height: 52px;
    }

    .link-row a {
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }

    .link-row .desc {
      text-align: left;
    }
  }
</style>
</head>
<body>

  <div class="wrap">

    <header>
      <div class="logos">
        <img src="ESAN-Logos/Marca UA Vertical RGB_BRANCO.png" alt="Universidade de Aveiro">
        <img src="ESAN-Logos/Marca UA Complementar BRANCO.png" alt="ESAN">
      </div>

      <div class="intro">
        <h1>Rúben Arroz</h1>
        <p class="tagline">Programador Web Fullstack &middot; Zoho &middot; Game Developer</p>
        <p>A estudar na ESAN, Universidade de Aveiro. Atualmente em regime freelance no projeto RIDE e no projeto <a href="https://retroclub.pt" target="_blank" rel="noopener">Retroclub</a>.</p>
      </div>
    </header>

    <nav>
      <div class="link-row">
        <a href="./aulas/">
          <span class="name">Aulas</span>
          <span class="desc">Exercícios de PAW</span>
        </a>
        <a href="./projeto/">
          <span class="name">I'm Gamer</span>
          <span class="desc">Projeto da unidade curricular</span>
        </a>
      </div>
    </nav>

  </div>

  <footer>
    <p>ESAN, Universidade de Aveiro. Ano letivo 2026/2027.</p>
  </footer>

</body>
</html>
